<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all — NIRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="shop">
<div id="site-header"></div>

<div class="shell">
  <div class="crumb"><a href="index.html">Home</a><span>/</span><span>Shop</span></div>
  <div class="phead">
    <h1>The edit</h1>
    <p>Sixteen pieces across skincare, body, makeup, bags, suits and heels. Filter by category, sort by what matters.</p>
  </div>

  <div class="shop-bar">
    <div class="chips" id="shopChips">
      <button class="chip on" data-cat="all">All</button>
      <button class="chip" data-cat="skincare">Skincare</button>
      <button class="chip" data-cat="makeup">Makeup</button>
      <button class="chip" data-cat="body">Body</button>
      <button class="chip" data-cat="bags">Bags</button>
      <button class="chip" data-cat="suits">Suits</button>
      <button class="chip" data-cat="heels">Heels</button>
    </div>
    <div class="sort">
      <span id="shopCount">16 pieces</span>
      <select id="sortSel" aria-label="Sort products">
        <option value="featured">Featured</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="rating">Top rated</option>
      </select>
    </div>
  </div>

  <div class="pgrid" id="shopGrid" style="padding:clamp(20px,3vw,40px) 0 var(--sec)"></div>
</div>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
